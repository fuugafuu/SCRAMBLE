name: Publish SCRAMBLE
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript modules
        run: node --check src/app.mjs && node --check src/effect.mjs && node --check src/tracker.mjs && node --check src/camera.mjs && node --check tests/camera-effect.test.mjs
      - name: Verify multi-face tracking
        run: node --test tests/*.test.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
